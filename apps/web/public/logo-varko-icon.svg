<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 170" role="img" aria-label="Varko CRM">
  <defs>
    <linearGradient id="varko-bars" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="200" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Tres barras ascendentes: crecimiento de ventas; leve inclinacion dinamica -->
  <g transform="translate(17,0) skewX(-8)">
    <rect x="20" y="80" width="44" height="72" rx="10" fill="url(#varko-bars)"/>
    <rect x="78" y="48" width="44" height="104" rx="10" fill="url(#varko-bars)"/>
    <rect x="136" y="16" width="44" height="136" rx="10" fill="url(#varko-bars)"/>
  </g>
</svg>
