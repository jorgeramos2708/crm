# Rate limiting: 1 zona general API + 1 estricta para login
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=15r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;

    # Ocultar versión de nginx
    server_tokens off;

    # Uploads (CSV 5MB, archivos 25MB) + margen
    client_max_body_size 30m;
    client_body_timeout 60s;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad para el SPA y estáticos
    # (el API ya trae los suyos vía helmet y se proxifican tal cual)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # No exponer dotfiles si alguna vez se cuelan
    location ~ /\. {
        deny all;
    }

    # Vue.js SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE stream: sin buffering para eventos en tiempo real
    location = /api/stream {
        proxy_pass http://crm-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Login con límite estricto anti fuerza bruta
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://crm-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Proxy API requests to backend (preserve /api prefix)
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://crm-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_http_version 1.1;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# Producción con TLS: terminar HTTPS en el proxy del cliente (o aquí con
# listen 443 ssl + certificados) y redirigir http→https. Ver README.
