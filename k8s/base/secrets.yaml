apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: crm
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://crm:REPLACE_ME@postgres.crm.svc.cluster.local:5432/crm"
  POSTGRES_PASSWORD: "REPLACE_ME"
  
  # Redis
  REDIS_URL: "redis://:REPLACE_ME@redis.crm.svc.cluster.local:6379"
  REDIS_PASSWORD: "REPLACE_ME"
  
  # Auth
  JWT_SECRET: "REPLACE_ME_MIN_32_CHARS"
  SESSION_SECRET: "REPLACE_ME_MIN_32_CHARS"
  SESSION_COOKIE: "crm_session"
  
  # Encryption
  MICROSOFT_CRYPTO_KEY: "REPLACE_ME_64_CHAR_HEX"
  
  # MinIO
  MINIO_ROOT_USER: "crm"
  MINIO_ROOT_PASSWORD: "REPLACE_ME"
  MINIO_PASSWORD: "REPLACE_ME"
  
  # SMTP
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASS: ""
  SMTP_FROM: ""
  
  # Stripe
  STRIPE_SECRET_KEY: "sk_live_REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_REPLACE_ME"
  STRIPE_PRICE_STARTER: "price_REPLACE_ME"
  STRIPE_PRICE_PROFESSIONAL: "price_REPLACE_ME"
  STRIPE_PRICE_ENTERPRISE: "price_REPLACE_ME"
  
  # OAuth
  GOOGLE_CLIENT_ID: "REPLACE_ME"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"
  GOOGLE_REDIRECT_URI: "https://api.crm.example.com/api/auth/google/callback"
  MICROSOFT_CLIENT_ID: "REPLACE_ME"
  MICROSOFT_CLIENT_SECRET: "REPLACE_ME"
  MICROSOFT_TENANT_ID: "common"
  MICROSOFT_REDIRECT_URI: "https://api.crm.example.com/api/auth/microsoft/callback"
  
  # External APIs
  CLEARBIT_API_KEY: "REPLACE_ME"
  APOLLO_API_KEY: "REPLACE_ME"
  SENTRY_DSN: "https://REPLACE_ME@o1.ingest.sentry.io/123456"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/REPLACE_ME"
  
  # MinIO
  MINIO_ENDPOINT: "minio.crm.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_USER: "crm"
  MINIO_PASSWORD: "REPLACE_ME"
  MINIO_BUCKET: "crm-archivos"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  
  # Frontend
  VITE_API_URL: "https://api.crm.example.com"
  VITE_METABASE_URL: "https://metabase.crm.example.com"