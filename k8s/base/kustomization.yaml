apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: crm

resources:
  - namespaces.yaml
  - configmap.yaml
  - secrets.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - worker-deployment.yaml

commonLabels:
  app.kubernetes.io/name: crm
  app.kubernetes.io/part-of: crm-platform

commonAnnotations:
  app.kubernetes.io/managed-by: kustomize