apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-web
  namespace: crm
  labels:
    app: crm-web
    app.kubernetes.io/name: crm-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm-web
  template:
    metadata:
      labels:
        app: crm-web
        app.kubernetes.io/name: crm-web
    spec:
      containers:
        - name: web
          image: crm-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: crm-web
  namespace: crm
  labels:
    app: crm-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: crm-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: crm
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;
      
      sendfile        on;
      tcp_nopush      on;
      tcp_nodelay     on;
      keepalive_timeout  65;
      types_hash_max_size 2048;
      
      # Gzip
      gzip on;
      gzip_vary on;
      gzip_min_length 1024;
      gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;
      
      # Rate limiting
      limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
      limit_req_zone $binary_remote_addr zone=login:10m rate=15r/m;
      
      # Upstream API
      upstream api_backend {
        server crm-api.crm.svc.cluster.local:3001;
        keepalive 32;
      }
      
      server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        
        # CSP
        add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; worker-src 'self'; connect-src 'self' https: ws: wss: http://localhost:3002;" always;
        
        # API proxy
        location /api/ {
          limit_req zone=api burst=60 nodelay;
          proxy_pass http://api_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_set_header Cookie $http_cookie;
          
          # WebSocket support
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_read_timeout 86400;
        }
        
        # Login rate limit
        location = /api/auth/login {
          limit_req zone=login burst=5 nodelay;
          proxy_pass http://api_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # SSE
        location = /api/stream {
          proxy_pass http://api_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 1h;
          chunked_transfer_encoding on;
        }
        
        # Service Worker - no cache
        location = /sw.js {
          add_header Cache-Control "no-cache, must-revalidate" always;
          try_files $uri =404;
        }
        
        # Manifest - no cache
        location = /manifest.webmanifest {
          add_header Cache-Control "no-cache" always;
          try_files $uri =404;
        }
        
        # Static assets - long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
          expires 1y;
          add_header Cache-Control "public, immutable";
          try_files $uri =404;
        }
        
        # SPA fallback
        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }