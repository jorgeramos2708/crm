apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  namespace: crm
data:
  NODE_ENV: "production"
  PORT: "3001"
  HOST: "0.0.0.0"
  CORS_ORIGIN: "https://crm.example.com"
  CURRENCY: "MXN"
  BCRYPT_ROUNDS: "12"
  RATE_LIMIT_MAX: "300"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  JWT_EXPIRES_IN: "7d"
  SESSION_TTL_SECONDS: "604800"
  GRAPH_PUBLIC_URL: "https://api.crm.example.com"
  MINIO_ENDPOINT: "minio.crm.svc.cluster.local"
  MINIO_PORT: "9000"
  MINIO_BUCKET: "crm-archivos"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_FROM: ""