name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_test

      - name: Build Docker
        run: docker build -t crm-api .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Tests
        run: npm test

      - name: Build Docker
        run: docker build -t crm-web -f Dockerfile.vue .

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:3001/health
          curl -f http://localhost:8081/

      - name: Run integration tests
        run: |
          # Login
          TOKEN=$(curl -s -X POST http://localhost:3001/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@crm.local","password":"admin1234"}' | jq -r .token)
          
          # Test pipeline CRUD
          PIPELINE=$(curl -s -X POST http://localhost:3001/api/pipelines \
            -H "Cookie: token=$TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Test Pipeline"}')
          echo "Pipeline created: $PIPELINE"

      - name: Cleanup
        run: docker-compose down