name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # setup.ts exige SELECT 1 (todas las suites cuelgan de él)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/crm_test

      - name: Build Docker
        run: docker build -t crm-api .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 22: jsdom 30 usa el global Iterator (solo 22+). Prod sigue en 20.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run build

      - name: Tests
        run: npm test

      - name: Build Docker
        run: docker build -t crm-web -f Dockerfile.vue .

  mermaid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Validate Mermaid diagrams
        run: |
          echo "Validating Mermaid diagrams..."
          for file in $(find . -name "*.mmd" -not -path "./node_modules/*" -not -path "./.git/*"); do
            echo "Checking $file..."
            mmdc --puppeteerConfigFile "$GITHUB_WORKSPACE/.github/mermaid-puppeteer.json" -i "$file" -o /tmp/mermaid-check.svg
            if [ $? -ne 0 ]; then
              echo "::error file=$file::Mermaid syntax error in $file"
              exit 1
            fi
          done
        shell: bash

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build images
        run: docker compose build postgres redis api worker web

      - name: Start infra
        run: docker compose up -d --build postgres redis

      - name: Wait for postgres
        run: |
          for i in $(seq 1 36); do
            docker compose exec -T postgres pg_isready -U crm -d crm && break
            sleep 5
          done
          docker compose exec -T postgres pg_isready -U crm -d crm

      - name: Migrate and seed
        run: |
          docker compose run --rm api npx tsx src/migrate.ts
          docker compose run --rm api npx tsx src/seed.ts

      - name: Start app
        run: docker compose up -d --build api worker web

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/api/push/vapid-key && break
            sleep 10
          done
          curl -f http://localhost:8081/api/push/vapid-key
          curl -sf http://localhost:8081/ | grep -q "Varko"

      - name: Run integration tests
        run: |
          # Login (sesión por cookie, como el frontend)
          curl -s -c jar.txt -X POST http://localhost:8081/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@crm.local","password":"admin1234"}'
          # Test pipeline CRUD
          PIPELINE=$(curl -s -b jar.txt -X POST http://localhost:8081/api/pipelines \
            -H "Content-Type: application/json" \
            -d '{"nombre":"Test Pipeline"}')
          echo "Pipeline created: $PIPELINE"
          echo "$PIPELINE" | grep -q '"id"'

      - name: Diagnose on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=80 postgres redis api worker web

      - name: Cleanup
        if: always()
        run: docker compose down -v